name: Build MultiWorld-Core

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Show available dev bundles
        run: |
          curl -s https://repo.papermc.io/repository/maven-public/dev/folia/dev-bundle/maven-metadata.xml | grep -o '<version>26[^<]*' | tail -5 || true
          curl -s https://folia-inquisitors.github.io/FoliaDevBundle/dev/folia/dev-bundle/maven-metadata.xml | grep -o '<version>26[^<]*' | tail -5 || true
      - name: Build
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MultiWorld-Core
          path: build/libs/MultiWorld-Core-*.jar
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MultiWorld-Core build ${{ github.run_number }}
          files: build/libs/MultiWorld-Core-*.jar
