name: Build MultiWorld-Core

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Folia ${{ matrix.mc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: [ "1.21.4", "1.21.5", "1.21.6", "1.21.7", "1.21.8", "1.21.11", "26.1.2", "26.2", "26.3" ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Build for Folia ${{ matrix.mc }}
        run: gradle build --no-daemon -Pmc=${{ matrix.mc }}
      - uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.mc }}
          path: build/libs/MultiWorld-Core-*.jar

  publish:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: jar-*
          merge-multiple: true
          path: jars
      - name: List jars
        run: ls -la jars
      - name: Store jars on dist branch
        run: |
          cp -r jars /tmp/jars
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan dist
          git rm -rf . -q
          cp /tmp/jars/*.jar .
          git add *.jar
          git commit -q -m "MultiWorld-Core jars from build ${{ github.run_number }}"
          git push -f -q origin dist
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MultiWorld-Core build ${{ github.run_number }}
          body: "One jar per Folia version: pick the jar whose name matches your server (e.g. MultiWorld-Core-1.0.0-folia-26.1.2.jar)."
          files: jars/*.jar
